dependencies:
  espressif/esp_jpeg: "~1.3.1"
  espressif/cjson: "^1.7.19"
  lvgl/lvgl:
    version: "^9.5.0"
    public: true
  espressif/esp_wifi_remote:
    # IDF 6.1: injected Wi-Fi headers must match esp_private/wifi.h (NAN types). >=1.6.0; requires esp_hosted >=2.11.
    # Elecrow Lesson16 (IDF 5.5.4) uses 0.16.1 + esp_hosted 2.7.0 — different toolchain, same SDIO pins/LDO.
    version: "~1.6.5"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "~2.12"
    rules:
      - if: "target in [esp32p4]"
